name: Deploy

on:
  release:
    types: [created]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  # One pack per platform: Native AOT compilation needs the build OS to match the target RID's OS. `any` is the portable
  # CoreCLR fallback and `pointer` is the top-level package that points at the RID-specific ones.
  # See: https://learn.microsoft.com/en-us/dotnet/core/tools/rid-specific-tools#package-your-tool
  pack:
    name: pack (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: ubuntu-latest, rid: any }
          - { os: ubuntu-latest, rid: pointer }
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"

      - name: Restore dependencies
        run: dotnet restore

      - name: Set Version
        run: |
          echo "${{ github.ref }}"
          $tagVersion = "${{ github.ref }}".substring(11)
          echo "buildVersion=$tagVersion.${{ github.run_number }}" >> $env:GITHUB_ENV
          echo "nugetVersion=$tagVersion" >> $env:GITHUB_ENV
          echo "preRelease=false" >> $env:GITHUB_ENV

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $rid = '${{ matrix.rid }}'
          $ridArgs = if ($rid -eq 'pointer') { @() } else { @('-r', $rid) }
          $packOutput = & dotnet pack @ridArgs -p:PackageVersion=${{ env.nugetVersion }} --configuration Release -o ${{ github.workspace }}/PackedNuget 2>&1
          $exitCode = $LASTEXITCODE
          $unexpectedErrors = $packOutput | Where-Object {
            $_ -match 'error' -and
            $_ -notmatch 'NU5017' -and
            $_ -notmatch '^Build failed with \d+ error\(s\)'
          }
          if ($exitCode -ne 0 -and $unexpectedErrors) {
            $unexpectedErrors | ForEach-Object { Write-Error $_ }
            throw "dotnet pack failed"
          }
          # NU5017 is a known false positive for RID-specific tool pointer packages (SDK 10 bug):
          # NuGet validation does not yet recognise DotnetToolSettings.xml as package content.
          # The package is created correctly. Verify it exists before proceeding.
          $pkgs = Get-ChildItem "${{ github.workspace }}/PackedNuget" -Filter "*.nupkg"
          if ($pkgs.Count -lt 1) { throw "Expected a .nupkg file but found none" }
          if ($exitCode -ne 0) {
            Write-Warning "dotnet pack returned exit code $exitCode, but only the known NU5017 false positive was detected."
          }
          exit 0

      - name: Upload Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: NuGet-${{ matrix.rid }}
          path: ${{ github.workspace }}/PackedNuget

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: pack
    environment:
      name: "Production"
      url: "https://www.nuget.org/packages/vstest-to-mtp"
    name: Push NuGets

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          pattern: NuGet-*
          merge-multiple: true

      # RID-specific packages MUST be published before the top-level pointer package.
      # If the pointer package is published first, installs will fail until all sub-packages exist.
      # See: https://learn.microsoft.com/en-us/dotnet/core/tools/rid-specific-tools#publish-your-tool
      - name: Push RID-specific NuGet packages
        run: |
          $version = "${{ github.ref }}".substring(11)
          foreach ($rid in @("win-x64", "linux-x64", "osx-arm64", "any")) {
            $pkg = "vstest-to-mtp.$rid.$version.nupkg"
            if (Test-Path $pkg) {
              dotnet nuget push $pkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
            }
          }

      - name: Push top-level pointer package
        run: |
          $version = "${{ github.ref }}".substring(11)
          dotnet nuget push "vstest-to-mtp.$version.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
