name: Build and Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  # For GitHub Auto Merge to work it must be enabled on the repo.
  # This can be done with the script here:
  # https://github.com/BenjaminMichaelis/DotnetTemplates/blob/main/SetupRepo.ps1
  # See documentation here:
  # https://docs.github.com/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/automatically-merging-a-pull-request
  automerge:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: fastify/github-action-merge-dependabot@v3.15.0
        with:
            use-github-auto-merge: true

  # The tool inspects real MSBuild state, file systems and SDK installs, all of which differ by OS
  # (path casing, ACLs, SDK discovery), so build and test on every supported OS.
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Let every OS finish so a single failure shows which platforms are affected.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"

      - name: Restore .NET Tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      # Formatting is OS independent, and .editorconfig requires LF, which a Windows checkout (CRLF) would not satisfy.
      - name: Enforce formatting
        if: runner.os == 'Linux'
        run: |
          .\.github\scripts\Invoke-DotNetFormatStrict.ps1 -DiscoverFromCurrentDirectory

      - name: Build
        run: dotnet build -p:ContinuousIntegrationBuild=True --no-restore --configuration Release

      - name: Enable Automated Test Report Artifact Upload
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --results-directory trx-data --report-trx --report-trx-filename tests.trx

      - name: Build and test VSTest fixtures
        run: .\.github\scripts\Invoke-FixtureBuildAndTest.ps1

      - name: Verify fixtures are unchanged
        run: |
          $changes = git status --porcelain -- fixtures
          if ($changes) {
            Write-Host $changes
            throw 'Building or testing modified the committed fixtures.'
          }

      - name: Generate merged failure playlist from TRX
        if: always()
        run: |
          $trxFiles = Get-ChildItem -Path "trx-data" -Recurse -File -Filter "*.trx" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          if (-not $trxFiles) {
            Write-Host "No TRX files found; skipping playlist generation."
            exit 0
          }

          New-Item -ItemType Directory -Force test-results | Out-Null
          dotnet trx-to-vsplaylist convert $trxFiles --output test-results/failed-tests.playlist --skip-empty

      - name: Upload failure playlist
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-playlist-${{ matrix.os }}
          path: test-results/failed-tests.playlist
          if-no-files-found: ignore

  # The tool ships as a Native AOT executable per platform plus a CoreCLR `any` fallback, each with an MSBuild host process next to it.
  # None of that is exercised by the unit tests (they run the CoreCLR build), so pack the real packages, install them like a user and
  # run them over the committed fixtures. Native AOT needs the build OS to match the target RID, hence one RID per OS.
  pack-and-smoke-test:
    name: pack-and-smoke-test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: "./global.json"

      # Native AOT links with the platform toolchain.
      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore

      # NU5017 is a known false positive for the pointer package (SDK 10): the package is still created. Any other error fails.
      - name: Pack
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'packages'
          foreach ($rid in @($null, '${{ matrix.rid }}', 'any')) {
            $ridArgs = if ($rid) { @('-r', $rid) } else { @() }
            $output = & dotnet pack VsTestToMtp/VsTestToMtp.csproj @ridArgs --configuration Release -o $out 2>&1
            $output | ForEach-Object { Write-Host $_ }
            $unexpected = $output | Where-Object { $_ -match 'error' -and $_ -notmatch 'NU5017' -and $_ -notmatch '^Build failed with \d+ error\(s\)' }
            if ($LASTEXITCODE -ne 0 -and $unexpected) { throw "dotnet pack $ridArgs failed" }
          }
          Get-ChildItem $out -Filter '*.nupkg' | ForEach-Object { Write-Host $_.Name }
          "PACKAGE_DIR=$out" >> $env:GITHUB_ENV

      - name: Smoke test the ${{ matrix.rid }} package
        run: .\.github\scripts\Invoke-PackedToolSmokeTest.ps1 -PackageDirectory $env:PACKAGE_DIR -Rid ${{ matrix.rid }}

      - name: Smoke test the any package
        run: .\.github\scripts\Invoke-PackedToolSmokeTest.ps1 -PackageDirectory $env:PACKAGE_DIR -Rid any

      - name: Verify fixtures are unchanged
        run: |
          $changes = git status --porcelain -- fixtures
          if ($changes) {
            Write-Host $changes
            throw 'The smoke test modified the committed fixtures.'
          }
